name: CI

# Branch pushes and pull requests only. Listing branches makes GitHub skip
# tag pushes here; tags are handled by release.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # Live integration tests skip themselves without MOODLE_TEST_* settings,
        # which CI never has.
        run: python -m pytest -v

  test-windows:
    name: Tests (Python 3.14, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v

  lowest-dependencies:
    name: Tests (lowest allowed dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install with the minimum version of every runtime dependency
        run: |
          python -m pip install uv
          python -m uv pip install --system --resolution lowest-direct -e .
          python -m pip install pytest packaging
          python -m pip list
      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and smoke-test it
        run: python scripts/check_wheel.py dist

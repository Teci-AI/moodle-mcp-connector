name: Release

# Two ways in:
# - Pushing a version tag such as v0.1.1: check that the tag matches
#   pyproject.toml and CHANGES.md, test and build, publish to PyPI (after
#   approval on the "pypi" environment), then create the GitHub release with
#   the wheel and sdist attached.
# - Running it by hand (Actions > Release > Run workflow): the same checks,
#   tests and build, then publish to TestPyPI only, as a dry run.
#
# Publishing uses PyPI Trusted Publishing: no API token is stored anywhere.
# Only the publishing jobs can request the OIDC token; the job that installs
# dependencies and runs the tests cannot.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the tag, version and release notes
        id: check
        env:
          # Only a pushed tag is checked against the version; a manual run
          # checks the version and release notes alone.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python scripts/release_check.py --tag "$TAG" --notes-out release-notes.md
          else
            python scripts/release_check.py --notes-out release-notes.md
          fi

      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v

      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and smoke-test it
        run: python scripts/check_wheel.py dist

      - name: Keep the release files and notes for the next jobs
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (manual runs)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/moodle-mcp-connector
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can be uploaded only once; repeat dry runs of the same
          # version keep the files already there instead of failing.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (tags)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moodle-mcp-connector
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release (tags, after PyPI)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
